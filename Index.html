        has_gst_charge:   /(?:cgst|sgst|igst|gst\s*@|\bgst\b[:\s@%\d])[:\s@%\d.]*\d/i.test(t),
      };
    };
    F.summary = summaryExtract(text || "");
    return F;
  };

  IF.gstinChecksumOk = function(gstin) {
    const RE = /^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;
    if (!RE.test(gstin)) return false;
    const A = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    let total = 0;
    for (let i = 0; i < gstin.length - 1; i++) {
      const v = A.indexOf(gstin[i]);
      const w = (i % 2 === 0) ? 1 : 2;
      const p = v * w;
      total += Math.floor(p / 36) + (p % 36);
    }
    return A[(36 - total % 36) % 36] === gstin[gstin.length - 1];
  };

  // Live GSTIN lookup against the GST portal public search API.
  // Returns { found, legalName, tradeName, status, registrationDate, stateCode,
  //           taxpayerType, portalUrl, error }.
  // The GST portal's taxpayer-detail API is publicly accessible (no auth
  // required) and is the same endpoint used by the official GST search
  // at services.gst.gov.in. On CORS failure or network error we return
  // the portal URL so the user can verify manually in one click.
  IF.gstinLookup = async function(gstin) {
    const portalUrl = `https://services.gst.gov.in/services/searchtp?gstin=${encodeURIComponent(gstin)}`;
    const directUrl = `https://services.gst.gov.in/services/api/search/taxpayerDetails?gstin=${encodeURIComponent(gstin)}`;
    if (!gstin || !IF.gstinChecksumOk(gstin)) {
      return { found: false, error: "Checksum invalid — GSTIN format incorrect", portalUrl };
    }
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 8000);
      let resp;
      try {
        resp = await fetch(directUrl, {
          method: "GET",
          headers: { "Accept": "application/json" },
          mode: "cors",
          signal: controller.signal,
        });
        clearTimeout(timeout);
      } catch (fetchErr) {
        clearTimeout(timeout);
        const isTimeout = fetchErr.name === "AbortError";
        const isCors = fetchErr.message && (
          fetchErr.message.includes("CORS") ||
          fetchErr.message.includes("cors") ||
          fetchErr.message.includes("NetworkError") ||
          fetchErr.message.includes("Failed to fetch") ||
          fetchErr.message.includes("Network request failed")
        );
        return {
          found: null,
          errorCode: isTimeout ? "TIMEOUT" : isCors ? "CORS_BLOCKED" : "NETWORK_ERROR",
          error: isTimeout
            ? "GST Portal Verification Failed: API Timeout (>8s). The GST portal may be slow or unavailable."
            : isCors
            ? "GST Portal Verification Failed: Browser security policy (CORS) blocks direct API access. Use the portal link to verify manually."
            : `GST Portal Verification Failed: Network Error — ${fetchErr.message}`,
          portalUrl,
        };
      }
      if (resp.status === 404) {
        return { found: false, error: "GSTIN not found in GST registry (HTTP 404)", portalUrl };
      }
      if (resp.status === 429) {
        return { found: null, errorCode: "RATE_LIMITED",
          error: "GST Portal Verification Failed: Rate limited — too many requests. Try again in a few minutes.", portalUrl };
      }
      if (!resp.ok) {
        return { found: null, errorCode: "HTTP_ERROR",
          error: `GST Portal Verification Failed: HTTP ${resp.status} — ${resp.statusText || "GST Portal Service Error"}`, portalUrl };
      }
      const data = await resp.json();
      if (data && (data.lgnm || data.tradeNam)) {
        return {
          found:            true,
          legalName:        data.lgnm      || null,
          tradeName:        data.tradeNam  || null,
          status:           data.sts       || null,
          registrationDate: data.rgdt      || null,
          stateCode:        data.stj       || null,
          taxpayerType:     data.ctb       || null,
          cancelDate:       data.cxdt      || null,
          portalUrl,
        };
      }
      return { found: false, error: "GSTIN not found in GST registry", portalUrl };
    } catch (err) {
      return {
        found: null,
        errorCode: "UNKNOWN",
        error: `GST Portal Verification Failed: ${err.message || "Unknown error"}`,
        portalUrl,
      };
    }
  };


  // ============================================================
  // DYNAMIC ACCOUNTING RECONCILIATION ENGINE
  // Vendor-agnostic — works across any invoice format.
  // ============================================================

  // Label classifiers — defined first so extractAllAmounts can use them
  IF.ACCT_LABELS = {
    base: /(?:sub[\s\-]?total|subtotal|item[s]?\s*(?:total|amount|value)|food\s*(?:total|amount|value)|taxable\s*(?:value|amount)|net\s*(?:amount|value)\b|bill\s*amount\b|basic\s*(?:amount|value)|gross\s*amount\b|amount\s*before\s*(?:tax|gst|vat)|total\s*before\s*(?:gst|tax|vat|charge)|base\s*(?:amount|value|fare)|fare\s*(?:amount|value)?\b|room\s*(?:rate|charge|amount)|merchandise\s*(?:total|amount)|product\s*(?:total|amount))/i,
    additive: /(?:service\s*(?:charge|tax|fee)\b|delivery\s*(?:charge|fee)\b|packing\s*(?:charge|fee)?\b|packaging\b|handling\b|convenience\s*fee\b|platform\s*fee\b|cgst\b|sgst\b|igst\b|utgst\b|\bgst\s*@|\bgst\b|vat\b|cess\b|surcharge\b|additional\s*(?:charge|tax)\b|levy\b|fuel\s*(?:surcharge|charge)\b|swachh\s*bharat\b|krishi\s*kalyan\b)/i,
    deductive: /(?:\bdiscount\b|less\b|coupon\b|voucher\s*(?:discount|value)?\b|loyalty\b|credit\b|concession\b|rebate\b|cashback\b|promo\b|waiver\b)/i,
    final: /(?:grand\s*total|net\s*(?:to\s*pay|payable|total|amount\s*due)\b|total\s*(?:payable|due|amount\s*payable|to\s*pay|invoice|bill)\b|amount\s*(?:due|payable|to\s*pay)\b|invoice\s*total\b|final\s*(?:total|amount|bill)\b|bill\s*total\b|total\s*bill\b|payable\s*amount\b|balance\s*(?:due|payable)\b|net\s*to\s*pay\b)/im,
  };

  // Extract ALL labeled amounts from invoice text, classified by accounting role.
  // Key fix over previous approach: deduplication is by label-prefix + type,
  // NOT by amount value alone — CGST 337.50 and SGST 337.50 share the same
  // value but are different components and must both be counted.
  IF.extractAllAmounts = function(text) {
    if (!text) return [];
    const results = [];
    const seen = new Set();
    const lines = text.split('\n');
    // Find the largest number in the document — used to identify bare TOTAL lines
    const allNums = [];
    for (const m of text.matchAll(/([0-9][0-9,]*\.[0-9]{2}|[0-9][0-9,]{3,})/g)) {
      const v = parseFloat(m[1].replace(/,/g, ''));
      if (v > 0 && v < 1e8) allNums.push(v);
    }
    const maxNum = allNums.length ? Math.max(...allNums) : 0;

    for (const line of lines) {
      const t = line.trim();
      if (!t || t.length < 3) continue;
      const nums = [];
      for (const m of t.matchAll(/([0-9][0-9,]*\.[0-9]{2}|[0-9][0-9,]{3,})/g)) {
        const v = parseFloat(m[1].replace(/,/g, ''));
        if (v >= 1 && v < 1e8) nums.push(v);
      }
      if (!nums.length) continue;
      const amount = nums[nums.length - 1];

      let type = null;
      if      (IF.ACCT_LABELS.final    .test(t)) type = 'final';
      else if (IF.ACCT_LABELS.base     .test(t)) type = 'base';
      else if (IF.ACCT_LABELS.additive .test(t)) type = 'additive';
      else if (IF.ACCT_LABELS.deductive.test(t)) type = 'deductive';
      // Bare "TOTAL" / "Total:" not caught by named patterns above —
      // treat as final only if this amount is the largest in the document
      else if (/^\s*total\b/i.test(t) && Math.abs(amount - maxNum) < 0.01) {
        type = 'final';
      }

      if (type) {
        // Deduplicate by label-prefix + type (not by amount)
        const labelKey = t.replace(/[\d,. ]+$/, '').replace(/[:+\-=@%*]+$/, '')
                          .trim().toLowerCase().slice(0, 40);
        const dk = type + ':' + labelKey;
        if (!seen.has(dk)) {
          seen.add(dk);
          results.push({ label: t.replace(/[\d,. ]+$/, '').replace(/[:+\-=]+$/, '').trim(), amount, type });
        }
      }
    }
    return results;
  };

  // Multi-path reconciliation: tries base+taxes, lineitems+taxes, component combos.
  // Returns { reconciles, path, anchor, base, totalAdditive, totalDeductive, detail }
  IF.reconcileInvoice = function(text, lineItems) {
    const amounts    = IF.extractAllAmounts(text);
    const bases      = amounts.filter(a => a.type === 'base');
    const additives  = amounts.filter(a => a.type === 'additive');
    const deductives = amounts.filter(a => a.type === 'deductive');
    const finals     = amounts.filter(a => a.type === 'final');

    const anchor = finals.length
      ? finals.reduce((m, a) => a.amount > m.amount ? a : m, finals[0]).amount
      : null;
    if (!anchor) return { reconciles: false, reason: 'No grand total found', amounts };

    const TOL  = 0.03;
    const ok   = (exp, act) => Math.abs(exp - act) / Math.max(act, 1) <= TOL;
    const sumA = additives .reduce((s, a) => s + a.amount, 0);
    const sumD = deductives.reduce((s, d) => s + d.amount, 0);
    const lineSum = (lineItems || []).reduce((s, li) => s + (li.amount || 0), 0);

    // Path 1: identified base + all additives - deductives = anchor
    for (const b of bases) {
      const exp = b.amount + sumA - sumD;
      if (ok(exp, anchor)) return {
        reconciles: true, path: 'base+charges+taxes', anchor,
        base: b.amount, totalAdditive: sumA, totalDeductive: sumD, expected: exp,
        detail: b.label + '(' + b.amount + ') + charges(' + sumA.toFixed(2) + ') - discounts(' + sumD.toFixed(2) + ') = ' + exp.toFixed(2),
      };
    }

    // Path 2: line items + additives - deductives = anchor
    if (lineSum > 0) {
      const exp = lineSum + sumA - sumD;
      if (ok(exp, anchor)) return {
        reconciles: true, path: 'lineitems+charges+taxes', anchor,
        base: lineSum, totalAdditive: sumA, totalDeductive: sumD, expected: exp,
        detail: 'lineItems(' + lineSum.toFixed(2) + ') + charges(' + sumA.toFixed(2) + ') - discounts(' + sumD.toFixed(2) + ') = ' + exp.toFixed(2),
      };
    }

    // Path 3: subtotal alone = anchor (no taxes found but doc is consistent)
    for (const b of bases) {
      if (ok(b.amount - sumD, anchor)) return {
        reconciles: true, path: 'base-discounts', anchor,
        base: b.amount, totalAdditive: 0, totalDeductive: sumD, expected: b.amount - sumD,
        detail: b.label + '(' + b.amount + ') - discounts(' + sumD.toFixed(2) + ') = anchor',
      };
    }

    // Path 4: component-pair / triple — any 2-3 extracted amounts summing to anchor
    const pool = [...bases, ...additives].filter(a => a.amount < anchor * 0.99);
    for (let i = 0; i < pool.length; i++) {
      for (let j = i + 1; j < pool.length; j++) {
        const s2 = pool[i].amount + pool[j].amount - sumD;
        if (ok(s2, anchor)) return {
          reconciles: true, path: 'component-pair', anchor, expected: s2, totalDeductive: sumD,
          detail: pool[i].label + '+' + pool[j].label + '-discounts(' + sumD.toFixed(2) + ') ≈ ' + anchor,
        };
        for (let k = j + 1; k < pool.length; k++) {
          const s3 = s2 + pool[k].amount;
          if (ok(s3, anchor)) return {
            reconciles: true, path: 'component-triple', anchor, expected: s3, totalDeductive: sumD,
            detail: pool[i].label + '+' + pool[j].label + '+' + pool[k].label + ' ≈ ' + anchor,
          };
        }
      }
    }

    return { reconciles: false, anchor, base: bases[0]?.amount || lineSum,
             totalAdditive: sumA, totalDeductive: sumD, reason: 'No path reconciles', amounts };
  };

  IF.contentScore = function(F) {
    let score = 0;
    const findings = [];
    const positives = [];
    const missing = [];
    if (!F.invoice_number) missing.push("invoice_number");
    if (!F.invoice_date)   missing.push("invoice_date");
    if (!F.amount)         missing.push("amount");
    if (!F.vendor_name)    missing.push("vendor_name");
    if (missing.length) {
      score += 15 * Math.min(3, missing.length);
      findings.push({ category:"content",
        severity: missing.length <= 2 ? "medium" : "high",
        code:"CONTENT_MISSING_FIELDS",
        message:`Missing fields: ${missing.join(", ")}. Expected on a standard invoice.`,
        details:{ missing } });
    } else {
      positives.push({ code:"CONTENT_ALL_FIELDS_PRESENT",
        message:"All standard invoice fields (number, date, amount, vendor) were extracted." });
    }
    if (F.gstin) {
      if (IF.gstinChecksumOk(F.gstin)) {
        positives.push({ code:"CONTENT_GSTIN_VALID",
          message:`GSTIN ${F.gstin} passes mod-36 checksum validation.` });
      } else {
        score += 35;
        findings.push({ category:"content", severity:"high", code:"CONTENT_GSTIN_INVALID",
          message:"GSTIN fails checksum validation — likely fabricated.",
          details:{ gstin: F.gstin } });
      }
    }
    // ── Dynamic accounting reconciliation ──────────────────────────────────
    // Uses IF.reconcileInvoice — tries multiple paths across any invoice format.
    // Only flags CONTENT_TOTAL_MISMATCH when NO accounting path reconciles.
    if (F.amount || F.raw_text) {
      const recon = IF.reconcileInvoice(F.raw_text || '', F.line_items);
      const lineItems = F.line_items || [];
      const lineSum = lineItems.reduce((a,i) => a + (i.amount||0), 0);
      const anchor = recon.anchor || F.amount;

      if (recon.reconciles) {
        positives.push({ code:'CONTENT_SUMMARY_RECONCILES',
          message: 'Invoice arithmetic reconciles via ' + recon.path + ': ' + recon.detail + '. No total discrepancy.',
          details: { path:recon.path, anchor, base:recon.base,
                     total_additive:recon.totalAdditive, total_deductive:recon.totalDeductive } });
      } else if (anchor) {
        const ratio = lineSum > 0 ? lineSum / anchor : 0;
        if (ratio > 5) {
          positives.push({ code:'CONTENT_LINEITEM_EXTRACTION_UNRELIABLE',
            message: 'Line-item sum (₹' + lineSum.toFixed(2) + ') is ' + ratio.toFixed(1) + '× the invoice total — OCR column-parsing failure, not a genuine discrepancy.',
            details: { line_sum:+lineSum.toFixed(2), anchor, ratio:+ratio.toFixed(2) } });
        } else if (lineSum > 0 && anchor > 0) {
          const diffPct = Math.abs(lineSum - anchor) / anchor;
          if (diffPct > 0.03) {
            score += 25;
            findings.push({ category:'content', severity:'high', code:'CONTENT_TOTAL_MISMATCH',
              message: 'Invoice total (₹' + anchor.toFixed(2) + ') does not reconcile — no valid accounting path found. Line-item sum: ₹' + lineSum.toFixed(2) + ', difference: ₹' + Math.abs(anchor-lineSum).toFixed(2) + ' (' + (diffPct*100).toFixed(1) + '%).',
              details: { invoice_total:anchor, line_item_sum:+lineSum.toFixed(2),
                         difference:+(anchor-lineSum).toFixed(2), difference_pct:+(diffPct*100).toFixed(2) } });
          } else {
            positives.push({ code:'CONTENT_TOTAL_RECONCILES',
              message: 'Line items (₹' + lineSum.toFixed(2) + ') reconcile with invoice total (₹' + anchor.toFixed(2) + ').' });
          }
        }
      }
    }

        // ── GST validation suite ────────────────────────────────────────────────
    const S = F.summary || {};
    const gstCharged = S.has_gst_charge ||
      /(?:cgst|sgst|igst|gst\s*@|gst\s*amount|gst\s*:\s*₹)/i.test(F.raw_text);
    const gstRatePresent = /gst\s*@\s*\d|cgst\s*@\s*\d|sgst\s*@\s*\d/i.test(F.raw_text);

    // GST Check 1 & 5: GSTIN presence
    if (!F.gstin) {
      if (gstCharged) {
        // GST is charged but no GSTIN visible — statutory non-compliance
        score += 30;
        findings.push({ category:"content", severity:"high",
          code:"GST_CHARGED_WITHOUT_GSTIN",
          message:`GST is charged on this invoice${gstRatePresent ? " (GST rate detected)" : ""} but no supplier GSTIN is visible. Under the CGST Act, a GST invoice must display the supplier's GSTIN. This invoice may be non-compliant and cannot be used for ITC (Input Tax Credit) claims.`,
          details:{ gst_charged: gstCharged, gstin_found: false, raw_gst_mention: gstCharged } });
      } else if (F.amount && F.amount > 2000) {
        // High-value invoice with no GSTIN at all
        findings.push({ category:"content", severity:"medium",
          code:"MISSING_GSTIN",
          message:"No GSTIN (Goods and Services Tax Identification Number) found on this invoice. GST-registered suppliers must display their GSTIN on all invoices. Absence may indicate the supplier is unregistered, the GSTIN was omitted, or OCR failed to extract it.",
          details:{ invoice_amount: F.amount } });
      }
    } else {
      // GST Check 2: GSTIN format validation
      if (!IF.gstinChecksumOk(F.gstin)) {
        score += 25;
        findings.push({ category:"content", severity:"high",
          code:"INVALID_GSTIN_FORMAT",
          message:`GSTIN "${F.gstin}" detected but fails format/checksum validation. A valid GSTIN is 15 characters: 2-digit state code + 10-char PAN + entity number + 'Z' + checksum. This GSTIN may be fabricated or misread by OCR.`,
          details:{ gstin: F.gstin, length: F.gstin.length, expected_length: 15 } });
      } else {
        positives.push({ code:"GSTIN_FORMAT_VALID",
          message:`GSTIN ${F.gstin} passes format and checksum validation (15 chars, valid state code, valid checksum).` });
      }
    }
    if (F.invoice_date) {
      // Try parsing in multiple orderings so US-style MM/DD/YYYY dates like
      // "03/13/2026" don't get flipped into an impossible day=13-of-month-3.
      // We pick the first interpretation that yields a real calendar date.
      const parsed = IF.parseDateFlexible(F.invoice_date);
      if (parsed) {
        // Only flag as "future" if it's more than a day ahead (allows for timezone slack)
        if (parsed.getTime() > Date.now() + 86400000) {
          score += 20;
          findings.push({ category:"content", severity:"medium", code:"CONTENT_DATE_IMPLAUSIBLE",
            message:`Invoice date '${F.invoice_date}' is in the future (parsed as ${parsed.toISOString().slice(0,10)}).`,
            details:{ date: F.invoice_date, parsed_iso: parsed.toISOString().slice(0,10) } });
        }
      }
    }
    return { score: Math.min(100, score), findings, positives };
  };

  // Parse an invoice date string into a Date, trying DD/MM/YYYY first (Indian
  // convention) then MM/DD/YYYY (US) then YYYY-MM-DD (ISO). Returns null if
  // none produce a valid calendar date.
  IF.parseDateFlexible = function(s) {
    if (!s) return null;
    const str = s.trim();
    const attempts = [];
    // ISO: YYYY-MM-DD
    let m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) attempts.push([+m[1], +m[2], +m[3]]);
    // Slash/dash/dot with 4-digit year in position 3
    m = str.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
    if (m) {
      const a = +m[1], b = +m[2], y = +m[3];
      // DD/MM if b is a plausible month; MM/DD if a is a plausible month.
      // If both are ≤12 we can't tell — try DD/MM first (Indian default).
      if (b >= 1 && b <= 12) attempts.push([y, b, a]);       // DD/MM/YYYY
      if (a >= 1 && a <= 12 && (b < 1 || b > 12)) attempts.push([y, a, b]);  // must be MM/DD
      else if (a >= 1 && a <= 12) attempts.push([y, a, b]);   // ambiguous, try MM/DD second
    }
    // 2-digit year
    m = str.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2})$/);
    if (m) {
      const a = +m[1], b = +m[2], y = 2000 + +m[3];
      if (b >= 1 && b <= 12) attempts.push([y, b, a]);
      if (a >= 1 && a <= 12 && (b < 1 || b > 12)) attempts.push([y, a, b]);
      else if (a >= 1 && a <= 12) attempts.push([y, a, b]);
    }
    for (const [y, mo, d] of attempts) {
      if (mo < 1 || mo > 12 || d < 1 || d > 31 || y < 1970 || y > 2100) continue;
      const dt = new Date(y, mo - 1, d);
      // Reject if JS rolled the date over (e.g. Feb 30 → March 2)
      if (dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d) return dt;
    }
    return null;
  };

  // ============================================================
  // Duplicate detection
  // ============================================================
  IF.checkDuplicates = async function(sha, phash, F, currentId, opts) {
    const skipDuplicate = opts && opts.skipDuplicate;
    const findings = [];
    const positives = [];
    const matches = [];
    const rows = (await IF.db.allJobs()).filter(r => r.id !== currentId);
    // Same-batch check: jobs in current upload not yet in DB
    const batchRows = [...(IF._batchRegistry || new Map()).entries()]
      .filter(([id]) => id !== currentId && !rows.find(r => r.id === id))
      .map(([id, d]) => ({ id, sha256: d.sha, phash: d.phash, vendor: d.vendor,
                            amount: d.amount, invoice_no: d.invoice_no,
                            filename: d.filename, created_at: new Date().toISOString(), _fromBatch: true }));
    const allRows = [...rows, ...batchRows];

    if (skipDuplicate) {
      positives.push({ code:"DUP_SKIPPED",
        message:"Duplicate check skipped (rescan mode)." });
      return { score: 0, findings, positives, matches };
    }

    const exact = allRows.find(r => r.sha256 === sha);
    if (exact) {
      findings.push({ category:"duplicate", severity:"critical", code:"DUP_EXACT",
        message:`Byte-identical file previously processed as "${exact.filename}" on ${(exact.created_at||"").slice(0,10)}. This is the same binary file — not a tampered copy.`,
        details:{ previous_id: exact.id, filename: exact.filename, first_seen: exact.created_at } });
      // Score 80 not 100 — genuine duplicates exist (monthly invoices from same vendor),
      // and this should not force 90% risk via the old override (now removed).
      return { score: 80, findings, positives, matches: [{ type:"sha256", id: exact.id, filename: exact.filename }] };
    }
    if (phash) {
      // Hamming ≤ 6 catches re-scans of the same physical document (noise
      // from scanner angle/DPI causes ~2-4 bit flip). Threshold of 12 was too
      // loose — two invoices from the same company using the same letterhead
      // template produce Hamming distances of 8-12 despite being different docs.
      const near = allRows.filter(r => r.phash)
        .map(r => ({ r, d: IF.hammingHex(phash, r.phash) }))
        .filter(x => x.d <= 6).sort((a,b) => a.d - b.d).slice(0, 3);
      if (near.length) {
        // Require at least one corroborating signal before raising a finding.
        // Same vendor name OR same invoice number strengthens the match significantly.
        const corroborated = near.filter(n => {
          const sameVendor = F.vendor_name && n.r.vendor &&
            F.vendor_name.toLowerCase().trim() === n.r.vendor.toLowerCase().trim();
          const sameInvNo = F.invoice_number && n.r.invoice_no &&
            F.invoice_number.replace(/\s/g,"") === n.r.invoice_no.replace(/\s/g,"");
          const sameAmount = F.amount && n.r.amount &&
            Math.abs(F.amount - n.r.amount) / Math.max(F.amount, n.r.amount) < 0.01;
          return sameVendor || sameInvNo || (sameAmount && n.d <= 4);
        });
        if (corroborated.length > 0) {
          findings.push({ category:"duplicate", severity:"high", code:"DUP_PHASH",
            message:`Visually near-identical to ${corroborated.length} previously-processed invoice${corroborated.length===1?"":"s"} (perceptual hash distance ≤ 6, corroborated by matching fields). Likely a re-scan or modified copy.`,
            details:{ matches: corroborated.map(n => ({ id: n.r.id, filename: n.r.filename, hamming: n.d })) } });
          matches.push(...corroborated.map(n => ({ type:"phash", id: n.r.id, filename: n.r.filename, hamming: n.d })));
        } else if (near.length > 0) {
          // Low Hamming but no corroborating fields — record as informational, not a finding
          positives.push({ code:"DUP_PHASH_UNCONFIRMED",
            message:`Perceptual hash is close (Hamming ${near[0].d}) to "${near[0].r.filename}" but no matching fields — likely same-template invoices from same vendor, not a duplicate.` });
        }
      }
    }
    if (F.vendor_name && F.amount) {
      const cands = allRows.filter(r => r.vendor && r.amount && Math.abs(r.amount - F.amount) / F.amount < 0.005);
      const hits = [];
      for (const c of cands) {
        const tok = s => new Set((s||"").toLowerCase().replace(/[^a-z0-9 ]/g,"").split(/\s+/).filter(Boolean));
        const s1 = tok(F.vendor_name), s2 = tok(c.vendor);
        if (!s1.size || !s2.size) continue;
        const inter = [...s1].filter(x => s2.has(x)).length;
        const jacc  = inter / new Set([...s1, ...s2]).size;
        if (jacc >= 0.8) hits.push({ id: c.id, filename: c.filename, jaccard: +jacc.toFixed(2), amount: c.amount });
      }
      if (hits.length) {
        findings.push({ category:"duplicate", severity:"high", code:"DUP_FUZZY_FIELDS",
          message:`Same vendor + same amount as ${hits.length} prior invoice${hits.length===1?"":"s"}. Could indicate a duplicate submission — verify invoice numbers differ.`,
          details:{ matches: hits.slice(0,5) } });
        matches.push(...hits.map(h => ({ type:"fuzzy_fields", ...h })));
      }
    }
    if (allRows.length > 0 && matches.length === 0) {
      positives.push({ code:"DUP_NONE_FOUND",
        message:`No duplicates found across ${allRows.length} previously-examined invoice${rows.length===1?"":"s"}.` });
    } else if (allRows.length === 0) {
      positives.push({ code:"DUP_FIRST_SUBMISSION",
        message:"First document in archive — no prior cases to compare against." });
    }
    const score = matches.some(m => m.type === "phash") ? 60 :
                  matches.some(m => m.type === "fuzzy_fields") ? 55 : 0;
    return { score, findings, positives, matches };
  };

  // ============================================================
  // AI-generation detection with threshold
  // ============================================================
  IF.aiDetect = function(canvas, ocrWords, hasMeta) {
    const w = canvas.width, h = canvas.height;
    const T = IF.THRESHOLDS.ai;
    const ctx = canvas.getContext("2d");
    const px = ctx.getImageData(0,0,w,h).data;
    const lapVals = [];
    let meanL = 0;
    for (let y = 1; y < h-1; y += 4)
      for (let x = 1; x < w-1; x += 4) {
        const i = (y*w + x) * 4;
        const g  = 0.299*px[i]   + 0.587*px[i+1]   + 0.114*px[i+2];
        const gu = 0.299*px[i-w*4] + 0.587*px[i-w*4+1] + 0.114*px[i-w*4+2];
        const gd = 0.299*px[i+w*4] + 0.587*px[i+w*4+1] + 0.114*px[i+w*4+2];
        const gl = 0.299*px[i-4]   + 0.587*px[i-3]     + 0.114*px[i-2];
        const gr = 0.299*px[i+4]   + 0.587*px[i+5]     + 0.114*px[i+6];
        lapVals.push(Math.abs(-4*g + gu + gd + gl + gr));
        meanL += lapVals[lapVals.length-1];
      }
    meanL /= lapVals.length;
    let lapStd = 0;
    for (const v of lapVals) lapStd += (v - meanL) ** 2;
    lapStd = Math.sqrt(lapStd / lapVals.length);
    const noiseCleanliness = lapStd >= 6 ? 0 : Math.max(0, (6 - lapStd) / 6);

    const tc = document.createElement("canvas");
    tc.width = 64; tc.height = 64;
    tc.getContext("2d").drawImage(canvas, 0, 0, 64, 64);
    const tpx = tc.getContext("2d").getImageData(0,0,64,64).data;
    const colors = new Set();
    for (let i = 0; i < tpx.length; i += 4)
      colors.add((tpx[i]<<16) | (tpx[i+1]<<8) | tpx[i+2]);
    const uniq = colors.size;
    const paletteFlatness = uniq <= 200 ? 1 : uniq >= 2000 ? 0 : (2000 - uniq) / 1800;

    let textPerfection = 0;
    if (ocrWords && ocrWords.length >= 20) {
      const confs = ocrWords.map(w => w.confidence || 0);
      const meanConf = confs.reduce((a,b) => a+b, 0) / confs.length;
      textPerfection = meanConf < 92 ? 0 : Math.min(1, (meanConf - 92) / 8);
    }
    const metadataVacuum = hasMeta ? 0 : 1;

    const features = { noise_cleanliness: noiseCleanliness, palette_flatness: paletteFlatness,
                       text_perfection: textPerfection, metadata_vacuum: metadataVacuum };
    const weights = { noise_cleanliness: 0.35, palette_flatness: 0.25,
                      text_perfection: 0.15, metadata_vacuum: 0.25 };
    const raw = Object.keys(features).reduce((a,k) => a + features[k] * weights[k], 0);
    const score = Math.min(100, raw * 100);
    const triggered = score >= T.trigger;
    const findings = [];
    const positives = [];
    if (triggered) {
      findings.push({ category:"ai",
        severity: score >= T.strong ? "high" : "medium",
        code:"AI_GENERATED_LIKELY",
        message:`Multiple indicators consistent with AI/synthetic generation (${score.toFixed(0)}/100).`,
        details:{ features: Object.fromEntries(Object.entries(features).map(([k,v]) => [k, +v.toFixed(2)])) } });
    } else if (score < 20) {
      positives.push({ code:"AI_GENUINE_ARTIFACTS_PRESENT",
        message:`Noise, palette, and text artifacts consistent with a real-world captured document.` });
    }
    return {
      score, findings, positives, triggered, features,
      measurements: {
        noise_std: +lapStd.toFixed(2),
        unique_colors: uniq,
        ocr_mean_confidence: ocrWords && ocrWords.length ? +(ocrWords.reduce((a,w) => a+(w.confidence||0), 0) / ocrWords.length).toFixed(1) : null,
        has_metadata: hasMeta,
      },
    };
  };

  // ============================================================
  // PDF structural analysis — detect incremental saves (edit history)
  // A clean PDF normally has exactly one "%%EOF" at end-of-line.
  // Linearized PDFs have 2 (linearization hint table + main body).
  // Re-saved or post-edited PDFs accumulate more.
  // We only fire when there's strong evidence: 2+ excess EOFs WITH /Prev xref
  // chains, OR 3+ excess EOFs (rare in any normal workflow).
  // ============================================================
  // ============================================================
  // PDF EDITING DETECTION — deep object-stream forensics
  // Parses raw PDF bytes for structural markers left by PDF editors:
  //   /Annot  — text annotations (most common edit method)
  //   /AcroForm — form field modifications
  //   Multiple /Font families — edited text uses editor's default font
  //   Object ID gaps — added objects get IDs much higher than originals
  //   Overlapping content streams — new content drawn over old
  //   /Redact — redaction objects (even "erased" content leaves traces)
  // ============================================================
  IF.pdfEditDetection = async function(file, fileType) {
    if (!fileType || !fileType.startsWith("pdf")) {
      return { score: 0, confidence: 0, findings: [], positives: [], triggered: false, measurements: {} };
    }
    try {
      const buf = await file.arrayBuffer();
      const decoder = new TextDecoder("latin1");
      const CHUNK = 131072; // 128 KB chunks
      let fullText = "";
      for (let off = 0; off < Math.min(buf.byteLength, 2097152); off += CHUNK) {
        fullText += decoder.decode(new Uint8Array(buf, off, Math.min(CHUNK, buf.byteLength - off)));
      }

      const findings = [];
      const positives = [];
      const signals = [];
      const measurements = {};

      // --- Signal 1: Annotation objects ---
      const annotCount = (fullText.match(/\/Annot\b/g) || []).length;
      // /Annots array references, not just the dictionary keys
      const annotArrays = (fullText.match(/\/Annots\s*\[/g) || []).length;
      measurements.annot_objects = annotCount;
      if (annotCount > 0) {
        signals.push({ type: "annotations", strength: Math.min(1, annotCount / 3),
          detail: `${annotCount} annotation object${annotCount === 1 ? "" : "s"} — text/highlight annotations are the most common PDF editing mechanism` });
      }

      // --- Signal 2: AcroForm (fillable form fields that may have been modified) ---
      const hasAcroForm = fullText.includes("/AcroForm");
      const hasXFA = fullText.includes("/XFA");
      measurements.has_acroform = hasAcroForm;
      if (hasAcroForm) {
        signals.push({ type: "acroform", strength: 0.5,
          detail: "PDF contains fillable form fields (AcroForm) — values may have been modified without creating an incremental save" });
      }

      // --- Signal 3: Multiple distinct font families ---
      const fontNames = new Set();
      const fontMatches = fullText.matchAll(/\/BaseFont\s*\/([A-Za-z0-9+_-]+)/g);
      for (const m of fontMatches) {
        // Strip subset prefix like "ABCDEF+" which encodes which characters are used
        const name = m[1].replace(/^[A-Z]{6}\+/, "");
        // Only count meaningful font families (not encoding artifacts)
        if (name.length > 2) fontNames.add(name.toLowerCase().replace(/(bold|italic|regular|medium|light|thin)/g, "").trim());
      }
      measurements.distinct_fonts = fontNames.size;
      measurements.font_names = [...fontNames].slice(0, 10);
      if (fontNames.size > 4) {
        signals.push({ type: "font_multiplicity", strength: Math.min(1, (fontNames.size - 4) / 6),
          detail: `${fontNames.size} distinct font families — legitimate invoices typically use 1-3; excess suggests text added by a different application` });
      }

      // --- Signal 4: Object ID gaps (added objects have high IDs) ---
      const objIds = [...fullText.matchAll(/^(\d+)\s+0\s+obj/gm)].map(m => parseInt(m[1])).sort((a, b) => a - b);
      let maxGap = 0;
      let gapAt = null;
      for (let i = 1; i < objIds.length; i++) {
        const gap = objIds[i] - objIds[i - 1];
        if (gap > maxGap) { maxGap = gap; gapAt = objIds[i - 1]; }
      }
      measurements.object_count = objIds.length;
      measurements.max_object_gap = maxGap;
      measurements.gap_position = gapAt;
      if (maxGap > 50 && objIds.length > 5) {
        signals.push({ type: "object_gap", strength: Math.min(1, maxGap / 200),
          detail: `Object ID gap of ${maxGap} at position ${gapAt} — large gaps suggest objects were added to the PDF after initial creation` });
      }

      // --- Signal 5: Redaction artifacts ---
      const hasRedact = fullText.includes("/Redact") || fullText.includes("/RichMedia");
      if (hasRedact) {
        signals.push({ type: "redaction", strength: 0.8,
          detail: "Redaction or rich media objects found — content may have been deliberately obscured or replaced" });
      }

      // --- Signal 6: Overlapping content (new stream placed over existing) ---
      // Look for /Type/Page objects with multiple content stream references
      const multiContentPages = (fullText.match(/\/Contents\s*\[[\d\s]+\d\s+\d[\d\s]*\]/g) || []).length;
      measurements.multi_content_pages = multiContentPages;
      if (multiContentPages > 0) {
        signals.push({ type: "multi_stream", strength: Math.min(1, multiContentPages / 2),
          detail: `${multiContentPages} page${multiContentPages === 1 ? "" : "s"} with multiple content streams — content layers added on top of existing content` });
      }

      // --- Signal 7: Suspicious producer change ---
      // Detect if the Creator and Producer fields suggest re-saving in an editor
      const producerMatch = fullText.match(/\/Producer\s*\(([^)]{1,80})\)/);
      const creatorMatch  = fullText.match(/\/Creator\s*\(([^)]{1,80})\)/);
      const producer = producerMatch ? producerMatch[1] : "";
      const creator  = creatorMatch  ? creatorMatch[1]  : "";
      const EDIT_APPS = ["acrobat", "foxit", "nitro", "pdf-xchange", "smallpdf",
                         "ilovepdf", "sejda", "pdfescape", "inkscape", "libreoffice draw"];
      const editApp = EDIT_APPS.find(a => producer.toLowerCase().includes(a) || creator.toLowerCase().includes(a));
      if (editApp) {
        signals.push({ type: "editor_producer", strength: 0.9,
          detail: `PDF was last saved by "${producer || creator}" — a known PDF editing tool` });
      }
      measurements.producer = producer;
      measurements.creator = creator;

      // --- Scoring ---
      // Weighted sum of signal strengths
      const scoreWeights = {
        annotations: 35, acroform: 15, font_multiplicity: 20,
        object_gap: 20, redaction: 30, multi_stream: 25, editor_producer: 35,
      };
      let rawScore = 0;
      for (const sig of signals) {
        rawScore += (scoreWeights[sig.type] || 15) * sig.strength;
      }
      const score = Math.min(100, rawScore);
      const triggered = score >= 35;  // Low threshold — editing evidence is serious
      const confidence = objIds.length > 3 ? 85 : 50;

      measurements.signals_detected = signals.map(s => s.type);

      if (triggered) {
        const severity = score >= 65 ? "high" : "medium";
        findings.push({
          category: "visual",
          severity,
          code: "PDF_EDIT_DETECTED",
          message: `${signals.length} PDF editing indicator${signals.length === 1 ? "" : "s"} detected: ${signals.map(s => s.type.replace("_", " ")).join(", ")}.`,
          details: {
            signals: signals.map(s => ({ type: s.type, detail: s.detail })),
            object_count: objIds.length,
            distinct_fonts: fontNames.size,
            annot_count: annotCount,
          },
        });
        // Individual signal explanations
        for (const sig of signals) {
          findings.push({
            category: "visual",
            severity: sig.strength >= 0.7 ? "high" : "medium",
            code: `PDF_EDIT_${sig.type.toUpperCase()}`,
            message: sig.detail,
            details: {},
          });
        }
      } else if (signals.length === 0) {
        positives.push({
          category: "visual",
          code: "PDF_EDIT_CLEAN",
          message: `No PDF editing indicators detected — no annotations, form fields, font anomalies, or object-stream irregularities.`,
        });
      } else {
        // Some signals but below threshold — note it
        positives.push({
          category: "visual",
          code: "PDF_EDIT_MINOR_SIGNALS",
          message: `Minor PDF structure signals (${signals.map(s => s.type).join(", ")}) — below threshold for a finding.`,
        });
      }

      return { score, confidence, findings, positives, triggered, measurements };
    } catch (err) {
      return { score: 0, confidence: 0, findings: [], positives: [], triggered: false,
               measurements: { error: String(err) } };
    }
  };

  IF.pdfStructure = async function(file, fileType) {
    if (!fileType || !fileType.startsWith("pdf")) {
      return { score: 0, confidence: 0, findings: [], positives: [], triggered: false, measurements: {} };
    }
    try {
      const buf = await file.arrayBuffer();
      const bytes = new Uint8Array(buf);
      let eofCount = 0;
      let prevCount = 0;
      let linearized = false;
      const CHUNK = 65536;
      const decoder = new TextDecoder("latin1");
      for (let off = 0; off < bytes.length; off += CHUNK) {
        const slice = decoder.decode(bytes.slice(off, Math.min(bytes.length, off + CHUNK + 16)));
        // Match %%EOF only when followed by newline or end-of-input — avoids
        // matching the literal string when it appears inside encoded streams.
        eofCount += (slice.match(/%%EOF\s*(\r|\n|$)/g) || []).length;
        // /Prev followed by digits in trailer dict — proper xref-chain marker.
        prevCount += (slice.match(/\/Prev\s+\d+/g) || []).length;
        // /Linearized as a PDF dictionary key (followed by space/digit/<<)
        if (/\/Linearized\s/.test(slice)) linearized = true;
      }
      // Baseline allowance: linearized PDFs legitimately get 2 EOFs.
      const editThreshold = linearized ? 2 : 1;
      const incrementalSaves = Math.max(0, eofCount - editThreshold);
      const T = IF.THRESHOLDS.pdf_structure;
      const findings = [];
      const positives = [];
      // SCORING MODEL (raised to reduce false positives on legitimate workflows):
      //   1 incremental save WITHOUT /Prev:  score 0  (probably normal re-save / merge)
      //   1 incremental save WITH /Prev:     score 30 (xref chain — possible edit)
      //   2+ incremental saves:              score scales up (40, 60, 80)
      //   3+ incremental saves:              score 90+ (definite tampering signature)
      let score = 0;
      if (incrementalSaves === 1 && prevCount > 0) score = 30;
      else if (incrementalSaves === 2) score = prevCount > 0 ? 65 : 35;
      else if (incrementalSaves === 3) score = prevCount > 0 ? 85 : 60;
      else if (incrementalSaves >= 4) score = 95;
      // Single excess EOF without /Prev is ignored entirely — too noisy.
      const triggered = score >= T.trigger;
      const confidence = 90;
      if (triggered) {
        findings.push({
          category: "metadata",
          severity: score >= T.strong ? "high" : "medium",
          code: "PDF_INCREMENTAL_SAVES",
          message: `PDF appears to have ${incrementalSaves} incremental save${incrementalSaves === 1 ? "" : "s"}` +
                   (prevCount > 0 ? ` with ${prevCount} cross-reference chain${prevCount === 1 ? "" : "s"} — strong indicator of post-creation editing.` : ` after creation.`),
          details: { eof_markers: eofCount, prev_xref_chains: prevCount, linearized, incremental_saves: incrementalSaves },
        });
      } else {
        const explain = linearized
          ? `linearized PDF, ${eofCount} %%EOF marker${eofCount === 1 ? "" : "s"} (expected for web-optimized PDFs)`
          : `${eofCount} %%EOF marker${eofCount === 1 ? "" : "s"}`;
        positives.push({
          category: "visual",
          code: "PDF_STRUCTURE_CLEAN",
          message: `PDF structure consistent with single-save workflow (${explain})${prevCount === 0 ? ", no cross-reference chains" : ""}.`,
        });
      }
      return {
        score, confidence, findings, positives, triggered,
        measurements: {
          eof_markers: eofCount, prev_xref_chains: prevCount,
          incremental_saves: incrementalSaves, linearized,
          baseline_allowance: editThreshold,
        },
      };
    } catch (err) {
      return {
        score: 0, confidence: 0, findings: [], positives: [], triggered: false,
        measurements: { error: String(err) },
      };
    }
  };

  // ============================================================
  // PDF deep object forensics — parse raw PDF byte stream for signs
  // of post-creation editing that %%EOF counting misses:
  //   /Annot objects (text annotations — primary edit tool in Acrobat/Foxit)
  //   /AcroForm / form fields (modified values)
  //   Multiple /Font dictionaries with mismatched BaseFont names
  //   /Subtype /Stamp objects (approval stamps often faked)
  //   Object ID discontinuities (newly added objects get anomalously high IDs)
  //   /Contents streams replaced or appended (overlaid text)
  // ============================================================
  IF.pdfDeepAnalysis = async function(file, fileType) {
    if (!fileType || !fileType.startsWith("pdf")) {
      return { score:0, confidence:0, findings:[], positives:[], triggered:false, measurements:{} };
    }
    try {
      const buf = await file.arrayBuffer();
      const bytes = new Uint8Array(buf);
      const CHUNK = 65536;
      const decoder = new TextDecoder("latin1");
      let fullText = "";
      for (let off = 0; off < bytes.length; off += CHUNK) {
        fullText += decoder.decode(bytes.slice(off, Math.min(bytes.length, off + CHUNK)));
      }
      // ---- Counters ----
      const annotCount   = (fullText.match(/\/Subtype\s*\/Text\b/g)     || []).length
                         + (fullText.match(/\/Subtype\s*\/FreeText\b/g)  || []).length
                         + (fullText.match(/\/Subtype\s*\/Widget\b/g)    || []).length;
      const stampCount   = (fullText.match(/\/Subtype\s*\/Stamp\b/g)     || []).length;
      const acroForm     = /\/AcroForm\s*<</.test(fullText);
      const hasXFA       = fullText.includes("/XFA");                       // dynamic form data
      const redactAnnot  = (fullText.match(/\/Subtype\s*\/Redact\b/g)    || []).length;

      // Font analysis — collect all BaseFont names
      const fontMatches  = [...fullText.matchAll(/\/BaseFont\s*\/([A-Za-z0-9+\-]+)/g)];
      const baseFonts    = new Set(fontMatches.map(m => m[1].replace(/^[A-Z]{6}\+/, ""))); // strip subset prefix
      // Suspicion: more than 4 distinct font families suggests edited content
      // (original invoice typically uses 1-2 families; editors add their own)
      const fontFamilies = new Set([...baseFonts].map(f => f.split("-")[0].split("_")[0]));

      // Object ID analysis — check for large gaps suggesting late additions
      const objIds = [...fullText.matchAll(/^(\d+)\s+0\s+obj\b/gm)].map(m => parseInt(m[1]));
      let maxGap = 0;
      const sortedIds = [...objIds].sort((a,b)=>a-b);
      for (let i = 1; i < sortedIds.length; i++) {
        const gap = sortedIds[i] - sortedIds[i-1];
        if (gap > maxGap) maxGap = gap;
      }
      // A gap > 50 in object IDs suggests objects were inserted from another document
      const hasIdGap = maxGap > 50 && objIds.length > 5;

      // Detect overlaid text: /BT ... ET blocks that appear AFTER the first one
      // (legitimate PDFs have one or two BT/ET runs per page; editors add more)
      const btBlocks = (fullText.match(/\bBT\b/g) || []).length;
      const etBlocks = (fullText.match(/\bET\b/g) || []).length;
      // If BT/ET blocks are extremely numerous relative to page count, suspect overlay
      // (approx 1 pdf page ≈ 2-6 text blocks)
      let pageCount = 1;
      try {
        const numPagesMatch = fullText.match(/\/N\s+(\d+)\s*\/Type\s*\/Pages/);
        if (numPagesMatch) pageCount = parseInt(numPagesMatch[1]) || 1;
      } catch {}
      const btPerPage = btBlocks / Math.max(1, pageCount);

      const findings  = [];
      const positives = [];
      const signals   = [];

      if (annotCount > 0) {
        signals.push({ type: "annotations", count: annotCount, weight: annotCount > 3 ? 1.0 : 0.65 });
      }
      if (stampCount > 0) {
        signals.push({ type: "stamp_objects", count: stampCount, weight: 0.75 });
      }
      if (acroForm) {
        signals.push({ type: "acroform_present", weight: 0.5 });
      }
      if (hasXFA) {
        signals.push({ type: "xfa_form_data", weight: 0.6 });
      }
      if (fontFamilies.size > 4) {
        signals.push({ type: "multiple_fonts", count: fontFamilies.size, weight: 0.6 });
      }
      if (hasIdGap) {
        signals.push({ type: "object_id_gap", gap: maxGap, weight: 0.7 });
      }
      if (btPerPage > 12) {
        signals.push({ type: "excessive_text_blocks", per_page: Math.round(btPerPage), weight: 0.65 });
      }

      const score = Math.min(100,
        signals.reduce((a, s) => a + s.weight * 35, 0)
      );
      const triggered = score >= 35;
      const confidence = 88;

      const measurements = {
        annotation_objects: annotCount,
        stamp_objects: stampCount,
        acroform: acroForm,
        xfa_form: hasXFA,
        font_families: fontFamilies.size,
        font_names: [...fontFamilies].slice(0,10),
        object_count: objIds.length,
        max_obj_id_gap: maxGap,
        bt_blocks_per_page: Math.round(btPerPage),
        signals_found: signals.length,
      };

      if (triggered) {
        const sigDesc = signals.map(s => {
          if (s.type === "annotations") return `${s.count} text annotation object${s.count>1?"s":""}`;
          if (s.type === "stamp_objects") return `${s.count} stamp object${s.count>1?"s":""}`;
          if (s.type === "acroform_present") return "form fields (AcroForm)";
          if (s.type === "xfa_form_data") return "XFA dynamic form data";
          if (s.type === "multiple_fonts") return `${s.count} distinct font families`;
          if (s.type === "object_id_gap") return `object ID gap of ${s.gap}`;
          if (s.type === "excessive_text_blocks") return `${s.per_page} text streams per page`;
          return s.type;
        }).join(", ");
        findings.push({
          category: "metadata",
          severity: score >= 65 ? "high" : "medium",
          code: "PDF_EDIT_OBJECTS",
          message: `PDF internal structure contains editing indicators: ${sigDesc}. These suggest the document was modified after original creation.`,
          details: measurements,
        });
      } else if (signals.length === 0) {
        positives.push({
          category: "metadata",
          code: "PDF_STRUCTURE_CLEAN",
          message: `PDF object structure is clean — no annotation objects, form fields, font anomalies, or object ID gaps detected.`,
        });
      }

      return { score, confidence, findings, positives, triggered, measurements };
    } catch (err) {
      return { score:0, confidence:0, findings:[], positives:[], triggered:false,
               measurements:{ error: String(err) } };
    }
  };

  // ============================================================
  // PDF incremental-region locator — pinpoints WHERE edits happened
  // When Acrobat edits a PDF it appends new content after the first
  // %%EOF. Each incremental section contains only the changed objects.
  // We parse those sections, extract BT…ET text blocks + coordinates,
  // convert PDF space (origin bottom-left, points) → canvas pixels,
  // and return bounding boxes so the annotated image can show exactly
  // which text regions were modified — not just "the PDF was edited".
  // ============================================================

  // ============================================================
  // PDF incremental-region locator — PDF.js-accurate coordinates
  //
  // Two-stage approach:
  //   Stage 1 (raw bytes): scan incremental-save sections (after first
  //     %%EOF) for content streams and extract { x, y, fontSize, str }
  //     items using BT/ET PDF operator parsing.
  //   Stage 2 (PDF.js): load the page, get its viewport transform, and
  //     call pdfjsLib.Util.applyTransform(point, viewport.transform) to
  //     convert every raw PDF-space coordinate to canvas pixels — which
  //     handles Y-flip, page rotation, and render scale automatically.
  //     Also call page.getAnnotations() for FreeText/Widget rects.
  //
  // This replaces all manual (pageHeightPt - y) * scale math with
  // PDF.js's own coordinate system, giving pixel-accurate boxes.
  // ============================================================
  // pageOffsets: array of { pageNum, y, height, xOff } describing where each
  // page sits in the STITCHED composite canvas (see IF.stitchPagesVertically).
  // Needed so boxes found on page 2, 3, etc. land in the right place on the
  // single annotated image that shows every page stacked vertically.
  IF.pdfIncrementalRegions = async function(file, fileType, pageOffsets, renderScale) {
    if (!fileType || !fileType.startsWith("pdf")) return [];
    renderScale = renderScale || 1.8;
    pageOffsets = pageOffsets || [];
    try {
      const buf = await file.arrayBuffer();
      const decoder = new TextDecoder("latin1");
      const raw = decoder.decode(new Uint8Array(buf));

      // ── Stage 1: extract raw text items from incremental sections ─
      const eofPositions = [];
      let em; const eofRe = /%%EOF/g;
      while ((em = eofRe.exec(raw)) !== null) eofPositions.push(em.index);
      if (eofPositions.length < 2) return [];   // single save — nothing edited

      const incrementalText = raw.slice(eofPositions[0] + 5);
      const rawItems = [];   // { x, y, fontSize, str }
      let om;
      const objRe = /\d+\s+\d+\s+obj([\s\S]*?)endobj/g;

      while ((om = objRe.exec(incrementalText)) !== null) {
        const objBody = om[1];
        // Skip annotation objects — handled via page.getAnnotations() below
        if (/\/Type\s*\/Annot/.test(objBody)) continue;
        const streamM = /stream\r?\n([\s\S]*?)\r?\nendstream/.exec(objBody);
        if (!streamM || !streamM[1].includes("BT")) continue;
        const btBlocks = streamM[1].match(/BT[\s\S]*?ET/g) || [];
        for (const block of btBlocks) {
          rawItems.push(...IF._extractRawTextItems(block));
        }
      }

      // ── Stage 2: test each item against EVERY page's viewport. A raw
      // text item only has (x, y) in PDF user-space, not a page reference —
      // so we figure out which page it belongs to by checking which page's
      // dimensions the point falls inside. This is robust because pages in
      // an invoice almost never share the exact same content placement.
      const pdfDoc = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
      const numPages = pdfDoc.numPages;
      const boxes = [];

      for (let pageNum = 1; pageNum <= numPages; pageNum++) {
        const page = await pdfDoc.getPage(pageNum);
        const viewport = page.getViewport({ scale: renderScale });
        const vt = viewport.transform;
        const off = pageOffsets.find(o => o.pageNum === pageNum) || { y: 0, xOff: 0 };

        for (const item of rawItems) {
          if (!item.str) continue;
          const [cx, cy] = pdfjsLib.Util.applyTransform([item.x, item.y], vt);
          // Only accept this item for THIS page if the mapped point lands
          // within this page's own canvas bounds
          if (cx < 0 || cx > viewport.width || cy < 0 || cy > viewport.height) continue;
          const w = Math.max(item.str.length * item.fontSize * 0.55 * renderScale, 8);
          const h = Math.max(Math.abs(item.fontSize * vt[3]), 6);
          if ((cy - h) > 0 && w > 0) {
            boxes.push([
              Math.round(cx - 2 + off.xOff),
              Math.round(cy - h - 2 + off.y),
              Math.round(w + 4),
              Math.round(h + 6),
            ]);
          }
        }

        // FreeText / Widget annotation rects on this specific page
        try {
          const annotations = await page.getAnnotations({ intent: "any" });
          for (const annot of annotations) {
            if (annot.subtype !== "FreeText" && annot.subtype !== "Widget") continue;
            const rect = annot.rect;
            if (!rect || rect.length < 4) continue;
            const [ax1, ay1] = pdfjsLib.Util.applyTransform([rect[0], rect[1]], vt);
            const [ax2, ay2] = pdfjsLib.Util.applyTransform([rect[2], rect[3]], vt);
            const bx = Math.min(ax1, ax2), by = Math.min(ay1, ay2);
            const bw = Math.abs(ax2 - ax1), bh = Math.abs(ay2 - ay1);
            if (bw > 3 && bh > 3) {
              boxes.push([
                Math.round(bx - 2 + off.xOff), Math.round(by - 2 + off.y),
                Math.round(bw + 4), Math.round(bh + 4),
              ]);
            }
          }
        } catch { /* optional */ }
      }

      return IF._deduplicateBoxes(boxes, 8);
    } catch { return []; }
  };

  // Extract raw { x, y, fontSize, str } from a single BT…ET block.
  // Handles Tm (absolute), Td/TD (relative move), T* (next line),
  // Tf (font+size), Tj (string), TJ (kerned string array).
  // Coordinates are raw PDF user-space — converted in Stage 2.
  IF._extractRawTextItems = function(block) {
    const items = [];
    let cx = 0, cy = 0, fs = 12, lineLeading = fs * 1.2;
    // Ensure each PDF operator lands on its own line for reliable parsing
    const lines = block
      .replace(/\r\n?/g, "\n")
      .replace(/\b(Tf|Tm|Td|TD|TL|T\*|Tj|TJ)\b\s*/g, "$1\n")
      .split("\n");

    for (const rawLine of lines) {
      const t = rawLine.trim();
      if (!t || t === "BT" || t === "ET") continue;

      let r;
      // Tf: /FontName size Tf
      r = t.match(/\/\S+\s+([\d.]+)\s+Tf/);
      if (r) { fs = parseFloat(r[1]); lineLeading = fs * 1.2; continue; }

      // TL: leading Tl
      r = t.match(/([\d.]+)\s+TL/);
      if (r) { lineLeading = parseFloat(r[1]); continue; }

      // Tm: a b c d e f Tm  →  e=x, f=y absolute in user space
      r = t.match(/([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+([-\d.]+)\s+Tm/);
      if (r) { cx = parseFloat(r[5]); cy = parseFloat(r[6]); continue; }

      // Td / TD: dx dy Td  →  relative move (PDF ops are case-sensitive: Td ≠ TD)
      r = t.match(/([-\d.]+)\s+([-\d.]+)\s+(?:Td|TD)(?:\s|$)/);
      if (r) { cx += parseFloat(r[1]); cy += parseFloat(r[2]); continue; }

      // T*: move to next line  (equivalent to 0 -leading Td)
      if (t === "T*") { cy -= lineLeading; continue; }

      // Tj: (string) Tj
      r = t.match(/\(([^)]*)\)\s+Tj/);
      if (r) {
        items.push({ x: cx, y: cy, fontSize: fs, str: r[1] });
        cx += r[1].length * fs * 0.55;
        continue;
      }

      // TJ: [(str) kern (str) ...] TJ
      r = t.match(/\[([^\]]+)\]\s+TJ/);
      if (r) {
        const pieces = r[1].match(/\(([^)]*)\)/g) || [];
        const str = pieces.map(s => s.slice(1, -1)).join("");
        items.push({ x: cx, y: cy, fontSize: fs, str });
        cx += str.length * fs * 0.55;
      }
    }
    return items;
  };

  IF._deduplicateBoxes = function(boxes, tol) {
    if (!boxes.length) return [];
    const used = new Array(boxes.length).fill(false);
    const merged = [];
    for (let i = 0; i < boxes.length; i++) {
      if (used[i]) continue;
      let [x, y, w, h] = boxes[i];
      let x2 = x+w, y2 = y+h;
      for (let j = i+1; j < boxes.length; j++) {
        if (used[j]) continue;
        const [bx, by, bw, bh] = boxes[j];
        if (Math.abs(bx - x) < tol && Math.abs(by - y) < tol) {
          x = Math.min(x,bx); y = Math.min(y,by);
          x2 = Math.max(x2, bx+bw); y2 = Math.max(y2, by+bh);
          used[j] = true;
        }
      }
      merged.push([x, y, x2-x, y2-y]);
    }
    return merged;
  };

  // ============================================================
  // ORIGINAL FORMAT DETECTION
  // Determines what application originally created the invoice —
  // not just what produced the PDF, but the upstream source:
  // was it Word, Tally, Google Docs, Canva, a Python script,
  // a web browser, a scanner, etc.
  //
  // Uses five signal layers:
  //   1. Creator / Producer / XMP metadata fields
  //   2. Embedded font names (each app has characteristic fonts)
  //   3. Structural PDF markers (Tagged, /Lang, linearized, PDF/A)
  //   4. XMP namespace signatures (Word, Google, Apple, etc.)
  //   5. PDF library fingerprints (jsPDF, iText, wkhtmltopdf, etc.)
  // ============================================================
  // ============================================================
  // SOURCE AUTHENTICITY CHECK
  //
  // Cross-references the vendor name extracted from the invoice
  // against the PDF creation tool detected by detectOriginalFormat.
  //
  // Core idea: every major company that issues invoices at scale
  // has a fixed, automated PDF generation stack. Uber receipts come
  // from Uber's backend servers — they would NEVER be generated by
  // Microsoft Word, Canva, or a free online invoice maker. If a PDF
  // claiming to be an Uber receipt was created in Word, a human
  // fabricated it.
  //
  // Returns { triggered, findings, severity, explanation }.
  // ============================================================
  IF.checkSourceAuthenticity = function(vendorName, originResult) {
    if (!vendorName || !originResult) return { triggered: false, findings: [] };
    const vL = vendorName.toLowerCase().replace(/[^a-z0-9 ]/g, " ");
    const origin = originResult.origin;
    const findings = [];

    // ── Known vendor profiles ──────────────────────────────────────
    // Each entry: regex to match vendor name from OCR, the expected PDF
    // generation category, and specific tool exclusions/inclusions.
    // "serverSide" = wkhtmltopdf / Puppeteer / iText / ReportLab / jsPDF
    //              / custom backend — all consistent with automated systems.
    // "accounting" = Tally / SAP / QuickBooks / Zoho / etc.
    // "scanner"    = physical scan of paper receipt — always acceptable.
    const VENDOR_PROFILES = [
      // ── Ride-hailing ────────────────────────────────────────────
      { name:"Uber",       re:/\buber\b/,        expected:["serverSide"],
        note:"Uber receipts are auto-generated by Uber's billing backend (typically a web rendering engine or custom PDF library). They are never created in Word, Excel, or design tools." },
      { name:"Ola",        re:/\bola\b|\bola\s*cabs\b/,   expected:["serverSide"],
        note:"Ola receipts are generated by Ola's billing system, not desktop document tools." },
      { name:"Rapido",     re:/\brapido\b/,       expected:["serverSide"],
        note:"Rapido receipts are auto-generated by their platform." },
      { name:"Meru",       re:/\bmeru\b/,         expected:["serverSide","accounting"],
        note:"Meru invoices are generated by their dispatch/billing system." },
      { name:"InDriver",   re:/\bindrive\b|\bindriver\b/,  expected:["serverSide"],
        note:"inDriver receipts are auto-generated by their platform." },

      // ── Food delivery ───────────────────────────────────────────
      { name:"Swiggy",     re:/\bswiggy\b/,       expected:["serverSide"],
        note:"Swiggy invoices are auto-generated by Swiggy's order management system." },
      { name:"Zomato",     re:/\bzomato\b/,       expected:["serverSide"],
        note:"Zomato invoices are auto-generated by Zomato's platform." },
      { name:"Dunzo",      re:/\bdunzo\b/,        expected:["serverSide"],
        note:"Dunzo receipts are auto-generated." },
      { name:"Blinkit",    re:/\bblinkit\b/,      expected:["serverSide"],
        note:"Blinkit receipts are auto-generated by their platform." },
      { name:"BigBasket",  re:/\bbigbasket\b/,    expected:["serverSide","accounting"],
        note:"BigBasket invoices are generated by their order management system." },

      // ── E-commerce ──────────────────────────────────────────────
      { name:"Amazon",     re:/\bamazon\b/,       expected:["serverSide"],
        note:"Amazon invoices are generated by Amazon's enterprise billing system (typically iText or custom Java-based PDF generation)." },
      { name:"Flipkart",   re:/\bflipkart\b/,     expected:["serverSide"],
        note:"Flipkart invoices are generated by Flipkart's order management system." },
      { name:"Meesho",     re:/\bmeesho\b/,       expected:["serverSide"],
        note:"Meesho invoices are auto-generated by their platform." },
      { name:"Myntra",     re:/\bmyntra\b/,       expected:["serverSide"],
        note:"Myntra invoices are generated by their platform." },
      { name:"Nykaa",      re:/\bnykaa\b/,        expected:["serverSide"],
        note:"Nykaa invoices are generated by their order system." },
      { name:"JioMart",    re:/\bjiomart\b/,      expected:["serverSide"],
        note:"JioMart invoices are generated by Reliance's platform." },

      // ── Travel & airlines ────────────────────────────────────────
      { name:"IndiGo",     re:/\bindigo\b|\binterglobe\b/, expected:["serverSide"],
        note:"IndiGo e-tickets and invoices are generated by their Passenger Service System (PSS), not document editors." },
      { name:"Air India",  re:/\bair\s*india\b/,  expected:["serverSide"],
        note:"Air India tickets/invoices are generated by their booking system." },
      { name:"SpiceJet",   re:/\bspicejet\b/,     expected:["serverSide"],
        note:"SpiceJet tickets are generated by their PSS." },
      { name:"Vistara",    re:/\bvistara\b/,      expected:["serverSide"],
        note:"Vistara tickets are generated by their booking system." },
      { name:"Air Asia",   re:/\bair\s*asia\b/,   expected:["serverSide"],
        note:"AirAsia invoices are generated by their booking platform." },
      { name:"IRCTC",      re:/\birctc\b/,        expected:["serverSide","govSystem"],
        note:"IRCTC e-tickets are generated by the Indian Railways ticketing system." },
      { name:"MakeMyTrip", re:/\bmakemytrip\b/,   expected:["serverSide"],
        note:"MakeMyTrip vouchers are generated by their booking platform." },
      { name:"Goibibo",    re:/\bgoibibo\b/,      expected:["serverSide"],
        note:"Goibibo vouchers are generated by their booking platform." },
      { name:"Yatra",      re:/\byatra\b/,        expected:["serverSide"],
        note:"Yatra invoices are generated by their booking system." },

      // ── Banking & fintech ────────────────────────────────────────
      { name:"HDFC Bank",  re:/\bhdfc\b/,         expected:["serverSide","bankSystem"],
        note:"HDFC Bank statements and receipts are generated by their core banking system." },
      { name:"ICICI Bank", re:/\bicici\b/,         expected:["serverSide","bankSystem"],
        note:"ICICI Bank documents are generated by their core banking system." },
      { name:"SBI",        re:/\bstate\s*bank|\bsbi\b/, expected:["serverSide","bankSystem","govSystem"],
        note:"SBI documents are generated by their core banking system." },
      { name:"Axis Bank",  re:/\baxis\s*bank\b/,  expected:["serverSide","bankSystem"],
        note:"Axis Bank documents are generated by their core banking system." },
      { name:"Paytm",      re:/\bpaytm\b/,        expected:["serverSide"],
        note:"Paytm receipts and invoices are generated by their platform." },
      { name:"PhonePe",    re:/\bphonepe\b/,      expected:["serverSide"],
        note:"PhonePe receipts are auto-generated by their platform." },
      { name:"Razorpay",   re:/\brazorpay\b/,     expected:["serverSide"],
        note:"Razorpay invoices are generated by their payment platform." },
      { name:"Google Pay",  re:/\bgooglepay\b|\bgoogle\s*pay\b/, expected:["serverSide"],
        note:"Google Pay receipts are generated by Google's payment system." },

      // ── Telecom ─────────────────────────────────────────────────
      { name:"Jio",        re:/\breliance\s*jio\b|\bjio\b/, expected:["serverSide","accounting"],
        note:"Jio bills are generated by their billing system." },
      { name:"Airtel",     re:/\bairtel\b/,       expected:["serverSide","accounting"],
        note:"Airtel bills are generated by their billing system." },
      { name:"BSNL",       re:/\bbsnl\b/,         expected:["serverSide","govSystem","accounting"],
        note:"BSNL bills are generated by their billing system." },
      { name:"Vi / Vodafone Idea", re:/\bvi\b|\bvodafone\b|\bidea\b/, expected:["serverSide","accounting"],
        note:"Vi bills are generated by their billing system." },

      // ── GST e-invoice ────────────────────────────────────────────
      { name:"GST e-Invoice (IRP)", re:/\birp\b|\birn\b|\be-invoice\b|\beinvoice\b/i, expected:["serverSide","accounting","govSystem"],
        note:"GST e-invoices registered on the Invoice Registration Portal carry a QR-embedded IRN and are generated by the IRP system or the taxpayer's ERP." },
    ];

    // ── Tool category classifier ───────────────────────────────────
    // Map the origin detection result to one of our expected-category keys
    const classifyOrigin = (origin) => {
      if (!origin || origin.name === "Unknown") return "unknown";
      const n = origin.name.toLowerCase();
      const cat = (origin.category || "").toLowerCase();

      if (cat.includes("accounting") || cat.includes("erp"))      return "accounting";
      if (cat.includes("scanner") || n.includes("scanner"))       return "scanner";
      if (cat.includes("programmatic") || cat.includes("library") ||
          n.includes("wkhtmltopdf") || n.includes("puppeteer") ||
          n.includes("itext") || n.includes("reportlab") ||
          n.includes("fpdf") || n.includes("tcpdf") ||
          n.includes("jspdf") || n.includes("pdfmake") ||
          n.includes("chrome") || n.includes("skia") ||
          n.includes("headless"))                                   return "serverSide";
      if (n.includes("word")  || n.includes("excel") ||
          n.includes("powerpoint"))                                 return "msOffice";
      if (n.includes("google docs") || n.includes("google sheets")) return "googleDocs";
      if (n.includes("libreoffice") || n.includes("openoffice"))    return "libreOffice";
      if (n.includes("canva") || n.includes("illustrator") ||
          n.includes("figma") || n.includes("affinity") ||
          n.includes("indesign"))                                    return "designTool";
      if (cat.includes("office") || n.includes("office"))           return "msOffice";
      return "other";
    };

    // ── Desktop/design tool flags — never expected from corporate systems ─
    const INCOMPATIBLE_CATEGORIES = {
      msOffice:   { label:"Microsoft Word / Excel", risk:"high",
        reason:"Major companies use automated backend systems to generate invoices — they never use Microsoft Word or Excel to produce individual customer receipts." },
      googleDocs: { label:"Google Docs / Sheets", risk:"high",
        reason:"Google Docs is a manual document editor, not a billing system. Corporate invoices are never generated individually in Google Docs." },
      libreOffice:{ label:"LibreOffice / OpenOffice", risk:"high",
        reason:"LibreOffice is a desktop office suite, not an automated billing system." },
      designTool: { label:"design / creative tool (Canva / Illustrator / Figma)", risk:"critical",
        reason:"Design tools like Canva and Illustrator are used to create visual layouts, not to generate transactional invoices from a database. A receipt created in a design tool was assembled manually — it did not come from any billing system." },
    };

    // ── Match vendor and check ─────────────────────────────────────
    const matchedVendor = VENDOR_PROFILES.find(v => v.re.test(vL));
    const originCategory = classifyOrigin(origin);

    if (!matchedVendor) {
      // For unrecognised vendors, flag ANY desktop document tool as a high-risk
      // indicator. Legitimate businesses don't manually type invoices in Word.
      const desktopToolFindings = {
        designTool:  { code:"SOURCE_DESIGN_TOOL",   sev:"high",
          msg:`This invoice PDF was created using a design/creative tool (${origin.name}). No legitimate invoicing system produces receipts in a design tool — this document was manually assembled.` },
        msOffice:    { code:"SOURCE_MANUAL_OFFICE",  sev:"high",
          msg:`This invoice PDF was created in ${origin.name}. Legitimate invoices from any billing system, ERP, or company backend are never generated by individually typing them into Microsoft Word or Excel and saving as PDF. This document was manually created by a person.` },
        googleDocs:  { code:"SOURCE_MANUAL_OFFICE",  sev:"high",
          msg:`This invoice PDF was created in ${origin.name}. Invoices from legitimate billing systems are never individually composed in Google Docs. This document was manually written by a person.` },
        libreOffice: { code:"SOURCE_MANUAL_OFFICE",  sev:"high",
          msg:`This invoice PDF was created in ${origin.name}. A manually created invoice in LibreOffice/OpenOffice is inconsistent with automated business invoicing.` },
      };
      const dt = desktopToolFindings[originCategory];
      if (dt) {
        findings.push({
          category:"metadata", severity: dt.sev, code: dt.code,
          message: dt.msg,
          details:{ detected_tool: origin.name, confidence: origin.confidence, vendor: vendorName },
        });
      }
      return { triggered: findings.length > 0, findings };
    }

    // Known vendor — check if origin tool is in expected categories
    const isExpected = matchedVendor.expected.includes(originCategory)
                    || originCategory === "scanner"      // physical scan always ok
                    || originCategory === "accounting";   // ERP always ok for B2B

    if (!isExpected && originCategory !== "unknown") {
      const incomp = INCOMPATIBLE_CATEGORIES[originCategory];
      const riskLevel = incomp ? incomp.risk : "high";
      const toolLabel = incomp ? incomp.label : origin.name;
      const incompatibleReason = incomp ? incomp.reason : `${origin.name} is not an expected PDF generation tool for ${matchedVendor.name}.`;

      findings.push({
        category: "metadata",
        severity: riskLevel === "critical" ? "critical" : "high",
        code: "SOURCE_TOOL_MISMATCH",
        message: `⚠ ${matchedVendor.name} invoice created in ${toolLabel} — this is a strong indicator of fabrication. ${matchedVendor.note} ${incompatibleReason}`,
        details: {
          vendor: matchedVendor.name,
          detected_tool: origin.name,
          tool_category: originCategory,
          expected_categories: matchedVendor.expected,
          confidence: origin.confidence,
          vendor_note: matchedVendor.note,
        },
      });
    } else if (isExpected) {
      findings.push({
        category: "metadata",
        code: "SOURCE_TOOL_CONSISTENT",
        severity: null,  // positive, not a finding
        message: `PDF creation tool (${origin.name}) is consistent with ${matchedVendor.name}'s known invoice generation system.`,
        _positive: true,
      });
    }

    const positiveFindings = findings.filter(f => f._positive);
    const realFindings = findings.filter(f => !f._positive);
    return { triggered: realFindings.length > 0, findings: realFindings, positives: positiveFindings };
  };

  IF.detectOriginalFormat = function(rawPdfText, pdfInfo) {
    const info       = pdfInfo || {};
    const creator    = (info.Creator  || info._xmpCreatorTool || "").toString();
    const producer   = (info.Producer || "").toString();
    const author     = (info._effectiveAuthor || info.Author || "").toString();
    const cL = creator.toLowerCase(), pL = producer.toLowerCase();

    // ── Extract embedded font names, strip 6-char subset prefix ─────
    const fontRaw = [...(rawPdfText.matchAll(/\/BaseFont\s*\/([A-Za-z0-9+_\-]+)/g))]
                      .map(m => m[1]);
    const fonts = [...new Set(fontRaw.map(f => f.replace(/^[A-Z]{6}\+/, "")))];

    // ── Structural markers ────────────────────────────────────────────
    const isTagged   = /\/Marked\s+(true|1)/i.test(rawPdfText);   // accessibility tagging
    const hasLang    = /\/Lang\s*\(/.test(rawPdfText);             // language tag
    const isPdfA     = /pdfaid:conformance|PDF\/A/i.test(rawPdfText);
    const hasStructTree = /\/StructTreeRoot/.test(rawPdfText);

    // ── XMP namespace signatures ──────────────────────────────────────
    const hasMsXmp     = /schemas\.microsoft\.com|office\.microsoft|msosid/i.test(rawPdfText);
    const hasWordXml   = /WordDocument|w:rsid|w:document/i.test(rawPdfText);
    const hasGoogleXmp = /google-docs|pdfgen\.googledocs|koogleDocs|google\.com\/pdf/i.test(rawPdfText);
    const hasAppleXmp  = /apple\.com|com\.apple/i.test(rawPdfText);
    const hasAdobeXmp  = /adobe\.com|ns\.adobe\.com/i.test(rawPdfText);

    // ── PDF library fingerprints in raw bytes ─────────────────────────
    const libSigs = {
      jsPDF:         /jsPDF|jspdf/i.test(rawPdfText + cL + pL),
      pdfMake:       /pdfmake/i.test(rawPdfText + cL + pL),
      iText:         /iText|iTextSharp/i.test(rawPdfText + cL + pL),
      fpdf:          /FPDF|TCPDF/i.test(rawPdfText + cL + pL),
      reportlab:     /ReportLab|reportlab/i.test(rawPdfText + cL + pL),
      wkhtmltopdf:   /wkhtmltopdf/i.test(rawPdfText + cL + pL),
      puppeteer:     /Headless|HeadlessChrome|puppeteer/i.test(rawPdfText + cL + pL),
      skiaChrome:    /Skia\/PDF|PDFium|ChromiumPDF/i.test(rawPdfText + pL),
      cairo:         /cairo/i.test(rawPdfText + pL),
      ghostscript:   /Ghostscript|GPL Ghostscript/i.test(rawPdfText + pL),
      libreoffice:   /LibreOffice|OpenOffice|StarOffice/i.test(rawPdfText + cL + pL),
    };

    // ── Font-based signals ────────────────────────────────────────────
    const fontHas = (re) => fonts.some(f => re.test(f));
    const fontSignals = {
      msWord:     fontHas(/^Calibri|^Cambria|^Segoe|^Constantia|^Consolas|^Arial|^TimesNewRoman/i),
      msExcel:    fontHas(/^Calibri|^Tahoma|^Arial/i) && /Excel|Spreadsheet/i.test(cL),
      googleDocs: fontHas(/^NotoSans|^NotoSerif|^Roboto|^OpenSans|^Lato|^Montserrat/i),
      apple:      fontHas(/^HelveticaNeue|^SFPro|^SFUI|^AppleSymbols/i),
      libre:      fontHas(/^FreeSans|^FreeSerif|^LiberationSans|^LiberationSerif|^DejaVu/i),
      tally:      fontHas(/^Arial|^Helvetica|^Mangal/i),
    };

    // ── Accounting / ERP software detection ─────────────────────────
    const accounting = [
      { name:"Tally",             pattern:/tally\.erp|tallyprime|tally solutions|tallysolutions/i,  confidence:98 },
      { name:"SAP",               pattern:/\bsap\b|crystal\s*reports|sap.*invoice/i,              confidence:95 },
      { name:"QuickBooks",        pattern:/intuit|quickbooks/i,                                    confidence:97 },
      { name:"Zoho Books",        pattern:/zoho/i,                                                  confidence:96 },
      { name:"FreshBooks",        pattern:/freshbooks/i,                                            confidence:97 },
      { name:"Xero",              pattern:/\bxero\b/i,                                              confidence:97 },
      { name:"Vyapar",            pattern:/vyapar/i,                                                confidence:98 },
      { name:"BUSY Accounting",   pattern:/\bbusy\b.*account|\bbusy\b.*software/i,                 confidence:97 },
      { name:"Marg ERP",          pattern:/marg\s*erp|\bmarg\b/i,                                  confidence:96 },
      { name:"myBillBook",        pattern:/mybillbook|my bill book/i,                               confidence:98 },
      { name:"ClearTax",          pattern:/cleartax/i,                                              confidence:97 },
      { name:"Razorpay",          pattern:/razorpay/i,                                              confidence:95 },
      { name:"Billbook",          pattern:/billbook/i,                                              confidence:93 },
      { name:"GSTHero",           pattern:/gsthero/i,                                              confidence:97 },
      { name:"EasyInvoice",       pattern:/easyinvoice/i,                                           confidence:95 },
      { name:"Munim",             pattern:/munim/i,                                                  confidence:97 },
      { name:"Acrobat Distiller", pattern:/acrobat distiller/i, confidence:80, note:"PDF render engine — original source may differ" },
    ];
    const accMatch = accounting.find(a => a.pattern.test(cL + " " + pL + " " + rawPdfText.slice(0, 2000)));

    // ── Office application detection ─────────────────────────────────
    const officeApps = [
      { name:"Microsoft Word",       re:/microsoft.*word|word.*microsoft|\bmsword\b/i,        confidence:95 },
      { name:"Microsoft Excel",      re:/microsoft.*excel|excel.*microsoft/i,                 confidence:95 },
      { name:"Microsoft PowerPoint", re:/powerpoint|microsoft.*ppt/i,                        confidence:94 },
      { name:"LibreOffice Writer",   re:/libreoffice.*writer|openoffice.*writer/i,            confidence:95 },
      { name:"LibreOffice Calc",     re:/libreoffice.*calc|openoffice.*calc/i,                confidence:95 },
      { name:"LibreOffice",          re:/libreoffice|openoffice|staroffice/i,                 confidence:90 },
      { name:"Google Docs",          re:/google.*docs|docs\.google/i,                          confidence:96 },
      { name:"Google Sheets",        re:/google.*sheets|sheets\.google/i,                     confidence:96 },
      { name:"Apple Pages",          re:/pages.*apple|apple.*pages|\bpages\b/i,               confidence:90 },
